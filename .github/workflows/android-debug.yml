name: Agenda YA Android - APK de pruebas

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/android-packaging

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Regenerar dependencias
        run: |
          rm -f package-lock.json
          npm cache clean --force
          npm install --no-audit --no-fund --prefer-online

      - name: Verificar archivos web
        run: |
          test -f www/index.html
          test -f capacitor.config.json

      - name: Crear proyecto Android nativo
        run: npx cap add android

      - name: Sincronizar aplicación web
        run: npx cap sync android

      - name: Compilar APK de pruebas
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: AgendaYA-Android-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
