name: Agenda YA Android - APK de pruebas

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/android-packaging

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Regenerar dependencias
        run: |
          rm -f package-lock.json
          npm cache clean --force
          npm install --no-audit --no-fund --prefer-online

      - name: Verificar archivos web
        run: |
          test -f www/index.html
          test -f www/login.html
          test -f www/dashboard.html
          test -f www/config.js
          test -f capacitor.config.json

      - name: Crear proyecto Android nativo
        run: npx cap add android

      - name: Aplicar iconos oficiales Agenda YA
        run: |
          mkdir -p android/app/src/main/res
          cp -R android-icon-resources/. android/app/src/main/res/
          python3 - <<'PYICON'
          from pathlib import Path
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          import re
          if 'android:icon="@mipmap/ic_launcher"' not in s:
              s=re.sub(r'<application\b', '<application android:icon="@mipmap/ic_launcher"', s, count=1)
          if re.search(r'android:roundIcon="[^"]*"', s):
              s=re.sub(r'android:roundIcon="[^"]*"', 'android:roundIcon="@mipmap/ic_launcher_round"', s, count=1)
          else:
              s=s.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round"', 1)
          p.write_text(s)
          PYICON

      - name: Sincronizar aplicación web
        run: npx cap sync android

      - name: Compilar APK de pruebas
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: AgendaYA-Android-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
